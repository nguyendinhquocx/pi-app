<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Li Web</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- CSP (spec T3). frame-ancestors only works as an HTTP header — see public/_headers.
         Dev note: the Vite dev server widens connect-src for HMR (see vite.config.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; connect-src 'self' wss://*.ts.net; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    />
    <script>
      // Anti-FOUC: restore theme before React mounts (localStorage lix-web-ui, LiX pattern).
      (function () {
        try {
          var raw = localStorage.getItem('lix-web-ui')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null
          var isDark =
            theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* first run */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
