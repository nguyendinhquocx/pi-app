<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Không tìm thấy trang · Li</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20242a;
        background: #f5f6f7;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        display: grid;
        place-items: center;
      }
      main {
        width: min(100%, 34rem);
        padding: clamp(1.5rem, 6vw, 2.5rem);
        border: 1px solid #d9dde2;
        border-radius: 14px;
        background: #fff;
      }
      h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { margin: 0 0 1.25rem; color: #58616c; line-height: 1.6; }
      a { color: #245abf; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        :root { color: #f0f2f4; background: #15191e; }
        main { border-color: #39414a; background: #20262d; }
        p { color: #c2c8d0; }
        a { color: #a7c5ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Không tìm thấy trang</h1>
      <p>Đường dẫn này không tồn tại hoặc đã được chuyển đi.</p>
      <a href="/">Quay lại Li Web</a>
    </main>
  </body>
</html>
